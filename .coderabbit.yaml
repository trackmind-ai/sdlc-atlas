#
# CodeRabbit config. Public repos get the full Pro feature set free — this file only tunes
# review behavior; which repos CodeRabbit watches is the org-level GitHub App install.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/__pycache__/**"
    # Generated by `install.sh --target cursor` from projects/project-template/.
    - "!plugins/sdlc-atlas/projects/project-template-cursor/**"
    # Scratch dirs from tools/write-project-claude.sh.
    - "!plugins/sdlc-atlas/projects/tmp-write-*/**"

  path_instructions:
    - path: "plugins/sdlc-atlas/platform/agents/*.md"
      instructions: >
        These files are executable instructions, not documentation: they are read verbatim
        into a model's context and grant tools that write files and run commands in a user's
        repository. Review with that blast radius in mind.
        Require YAML frontmatter with `name` (matching the filename exactly), `description`,
        and `tools`. Flag any widening of the `tools` list or `permissionMode` that the PR
        description does not justify — especially adding Bash, Write, or Edit to an agent that
        previously only read files.
        Flag any change that would let the pipeline write production code without an approval
        marker at .claude/memory/approvals/ACTIVE, or modify capability files outside
        /approve-proposal.
        Flag any instruction that treats fetched content (work items, attachments, pages,
        source files) as instructions to follow rather than data to report on.

    - path: "plugins/sdlc-atlas/platform/skills/*.md"
      instructions: >
        Frontmatter `name` MUST equal the filename stem. Claude Code resolves skills by
        frontmatter name, so a mismatch makes the skill silently unloadable for every agent
        that requests it — this has already happened once in this repo.

    - path: "plugins/sdlc-atlas/stacks/**/STACK.md"
      instructions: >
        Every stack must carry its defaults line with `test`, `security`, and `lint` commands
        in backticks. tools/init-project-layer.sh parses it to generate a project's gate
        commands, so a stack missing it yields a project with no test command.

    - path: "**/*.sh"
      instructions: >
        Must be portable across Linux, macOS, and Git Bash on Windows.
        Flag any use of `python3`: on Windows that name is frequently a WindowsApps stub that
        exits 0 without running, which has already caused a governance hook to fail open and a
        validation script to report all files invalid. Resolve an interpreter explicitly, or
        avoid needing one.
        Flag `|| true` on a check whose failure should fail CI.

    - path: "**/settings.json"
      instructions: >
        These define the permission boundary and the governance hooks. Flag any widening of
        permissions.allow (especially broad Bash patterns), and any hook that could fail OPEN —
        a hook guarding approvals or capability files must exit non-zero when it cannot parse
        its input, never exit 0.

chat:
  auto_reply: true
