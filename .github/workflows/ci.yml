name: CI

# Deliberately `pull_request`, never `pull_request_target` — a forked PR must never get
# access to a repo secret. Nothing here needs one (public runners, no API keys), so a
# fork PR runs identically to an in-repo PR.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repo is ~330 files of Markdown capability definitions plus a dozen install scripts.
# There is no application code and no test suite, so there is deliberately no test matrix,
# no integration matrix, and no typechecker here — those jobs would be green without
# proving anything. Each job below can genuinely fail on a real defect.
jobs:
  validate:
    name: Validate plugin + capability definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Checks manifest shape: plugin.json / marketplace.json well-formed, declared
      # command/agent/skill directories actually resolve.
      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      # Checks what manifest shape alone cannot: agent frontmatter is parseable, every
      # skill an agent names exists, every command maps to a real agent. A broken
      # reference here ships a plugin that fails at runtime for every user.
      - name: Validate agent frontmatter and skill references
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python scripts/validate_agents.py

  lint:
    name: Lint scripts and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `|| true` — a shellcheck finding fails the job. The installers are the first
      # thing a new user runs; a broken one is the worst possible first impression.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning

      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: verifies relative links between the ~330 in-repo Markdown files.
          # External URLs are excluded — they rot for reasons unrelated to a given PR
          # and would make CI fail on unrelated schedules.
          args: --offline --no-progress --include-fragments '**/*.md'
          fail: true

  hygiene:
    name: Secret scan + required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Real scanner with a real exit code, replacing a grep for the words
      # "password|secret|token" that only ever echoed a warning.
      #
      # The gitleaks BINARY, not gitleaks/gitleaks-action@v2: that action refuses to run on
      # any organization-owned repository without a paid GITLEAKS_LICENSE secret ("[org] is
      # an organization. License key is required"), which fails the job without scanning
      # anything. The binary itself is MIT-licensed and free — same detection, no license.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `git` mode scans full history, which is the point of fetch-depth: 0 above.
          /tmp/gitleaks git . --redact --verbose --exit-code 1

      - name: Required governance files present
        run: |
          missing=0
          for f in LICENSE README.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   SECURITY.md CHANGELOG.md GOVERNANCE.md \
                   plugins/sdlc-atlas/.claude-plugin/plugin.json; do
            if [ -f "$f" ]; then
              echo "  ok       $f"
            else
              echo "::error::missing required file: $f"
              missing=1
            fi
          done
          exit "$missing"
